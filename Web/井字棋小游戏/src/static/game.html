    <style>
        /* 頁面整體樣式 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }

        /* 遊戲容器 */
        #game-container {
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            color: #1a73e8;
        }

        /* 棋盤網格 */
        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            width: 315px; /* 100*3 + 5*2 */
        }

        /* 棋盤格子 */
        .cell {
            width: 100px;
            height: 100px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cell:hover {
            background-color: #e8f0fe;
        }

        /* X 和 O 的顏色 */
        .cell.x {
            color: #ea4335;
        }

        .cell.o {
            color: #4285f4;
        }

        /* 遊戲狀態訊息 */
        #status {
            font-size: 1.5em;
            margin-top: 20px;
            height: 30px;
        }
        
        /* 重新開始按鈕 */
        #restart-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            background-color: #1a73e8;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #restart-button:hover {
            background-color: #185abc;
        }

    </style>
</head>
